name: Build and test

on:
  push:
    branches: [main, 'feature/**']
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          persist-credentials: false
      - name: Set up Java 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - name: Verify reactor
        run: ./mvnw -B -ntp -Prelease-preparation clean install
      - name: Verify standalone memory and JDBC consumer dependencies
        run: python3 scripts/check_memory_consumer.py
      - name: Test dependency audit script
        run: python3 -m unittest discover -s scripts -p 'test_*.py'
      - name: Generate dependency SBOM
        run: >
          ./mvnw -B -ntp org.cyclonedx:cyclonedx-maven-plugin:2.9.1:makeAggregateBom
          -DincludeTestScope=true -DoutputReactorProjects=false -DskipNotDeployed=false
          -Dcyclonedx.skipAttach=true -DoutputFormat=json
      - name: Audit known dependency vulnerabilities
        run: python3 scripts/audit_dependencies.py target/bom.json --output target/osv-report.json --report-only
      - name: Validate local release staging (no upload)
        run: python3 scripts/stage_release.py
      - name: Publish coverage summary
        run: python3 scripts/coverage_summary.py batchrecover-coverage/target/site/jacoco-aggregate/jacoco.xml | tee -a "$GITHUB_STEP_SUMMARY"
      - name: Mutation testing (critical domain)
        run: ./mvnw -B -ntp -pl batchrecover-core -Pmutation org.pitest:pitest-maven:mutationCoverage
      - name: SpotBugs analysis (library modules)
        run: >
          ./mvnw -B -ntp
          -pl batchrecover-core,batchrecover-storage-memory,batchrecover-storage-jdbc,batchrecover-spring-batch,batchrecover-spring-boot-starter
          com.github.spotbugs:spotbugs-maven-plugin:4.9.8.1:spotbugs
          -Dspotbugs.xmlOutput=true
      - name: Compile isolated JMH benchmarks
        run: >
          ./mvnw -B -ntp -f benchmarks/pom.xml compile
          org.apache.maven.plugins:maven-dependency-plugin:3.9.0:build-classpath
          -Dmdep.outputFile=target/classpath.txt -DincludeScope=runtime
      - name: JMH smoke benchmark
        run: |
          java -cp "benchmarks/target/classes:$(cat benchmarks/target/classpath.txt)" org.openjdk.jmh.Main \
            '.*MemoryRecoveryBenchmark.*' -f 1 -wi 1 -i 2 -w 1s -r 1s -foe true \
            -prof gc -rf json -rff benchmarks/target/jmh.json
      - name: Quality hardening summary
        run: python3 scripts/quality_report.py | tee -a "$GITHUB_STEP_SUMMARY"
      - name: Upload quality and staging artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: quality-and-local-staging
          path: |
            **/target/site/jacoco*/**
            **/target/pit-reports/**
            **/target/spotbugsXml.xml
            benchmarks/target/jmh.json
            target/bom.json
            target/osv-report.json
            target/batchrecover-local-preview.zip
          if-no-files-found: warn
      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports
          path: |
            **/target/surefire-reports/*.xml
            **/target/failsafe-reports/*.xml
          if-no-files-found: warn
