name: Build and test

on:
  push:
    branches: [main, 'feature/**', 'chore/**']
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - name: Set up Java 21
        uses: actions/setup-java@d1374f8ac74474200d16ef8ecee22c7ae7a51880 # v6.3.0
        with:
          distribution: temurin
          java-version: '21'
      - name: Isolate Maven repository for build dependency inventory
        run: |
          mkdir -p "$RUNNER_TEMP/batchrecover-m2"
          echo "MAVEN_ARGS=-Dmaven.repo.local=$RUNNER_TEMP/batchrecover-m2" >> "$GITHUB_ENV"
          echo "BATCHRECOVER_TRACE_MAVEN=1" >> "$GITHUB_ENV"
      - name: Build patched test images from pinned bases and record identities
        id: prepare-images
        run: bash scripts/audit_test_images.sh prepare
      - name: Verify reactor
        run: python3 scripts/run_maven_ci.py -B -ntp -Prelease-preparation clean install
      - name: Build and test independent consumer applications
        run: |
          python3 scripts/run_maven_ci.py -B -ntp -f consumer-examples/memory/pom.xml clean verify
          python3 scripts/run_maven_ci.py -B -ntp -f consumer-examples/jdbc/pom.xml clean verify
          java -jar consumer-examples/memory/target/batchrecover-memory-consumer-1.0.0-SNAPSHOT.jar
      - name: Verify standalone memory and JDBC consumer dependencies
        run: python3 scripts/check_memory_consumer.py
      - name: Test dependency audit script
        run: python3 -m unittest discover -s scripts -p 'test_*.py'
      - name: Generate dependency SBOM
        run: >
          python3 scripts/run_maven_ci.py -B -ntp org.cyclonedx:cyclonedx-maven-plugin:2.9.3:makeAggregateBom
          -DincludeTestScope=true -DoutputReactorProjects=false -Dcyclonedx.skipNotDeployed=false
          -Dcyclonedx.skipAttach=true -DoutputFormat=json
      - name: Audit known dependency vulnerabilities
        run: python3 scripts/audit_dependencies.py target/bom.json --output target/osv-report.json
      - name: Validate local release staging (no upload)
        run: python3 scripts/stage_release.py
      - name: Publish coverage summary
        shell: bash
        run: python3 scripts/coverage_summary.py batchrecover-coverage/target/site/jacoco-aggregate/jacoco.xml | tee -a "$GITHUB_STEP_SUMMARY"
      - name: Mutation testing (critical domain)
        run: python3 scripts/run_maven_ci.py -B -ntp -pl batchrecover-core -Pmutation org.pitest:pitest-maven:mutationCoverage
      - name: SpotBugs analysis (library modules)
        run: >
          python3 scripts/run_maven_ci.py -B -ntp
          -pl batchrecover-core,batchrecover-storage-memory,batchrecover-storage-jdbc,batchrecover-spring-batch,batchrecover-spring-boot-starter
          com.github.spotbugs:spotbugs-maven-plugin:4.10.5.0:spotbugs
          -Dspotbugs.xmlOutput=true
      - name: Compile isolated JMH benchmarks
        run: >
          python3 scripts/run_maven_ci.py -B -ntp -f benchmarks/pom.xml compile
          org.apache.maven.plugins:maven-dependency-plugin:3.11.0:build-classpath
          -Dmdep.outputFile=target/classpath.txt -DincludeScope=runtime
      - name: JMH smoke benchmark
        run: |
          java -cp "benchmarks/target/classes:$(cat benchmarks/target/classpath.txt)" org.openjdk.jmh.Main \
            '.*MemoryRecoveryBenchmark.*' -f 1 -wi 1 -i 2 -w 1s -r 1s -foe true \
            -prof gc -rf json -rff benchmarks/target/jmh.json
      - name: Quality hardening summary
        shell: bash
        run: python3 scripts/quality_report.py --strict | tee -a "$GITHUB_STEP_SUMMARY"
      - name: Audit resolved build and plugin dependency coordinates
        run: |
          python3 scripts/audit_build_repository.py "$RUNNER_TEMP/batchrecover-m2" --output target/build-dependency-inventory.json
          python3 scripts/audit_dependencies.py target/build-dependency-inventory.json --output target/build-osv-report.json
      - name: Scan integration test images for HIGH and CRITICAL vulnerabilities
        if: ${{ !cancelled() && steps.prepare-images.outcome == 'success' }}
        run: bash scripts/audit_test_images.sh scan
      - name: Sign and verify tested release artifacts with disposable key (no upload)
        run: bash scripts/rehearse_release.sh
      - name: Collect filtered Maven dependency provenance
        if: always()
        run: |
          mkdir -p target
          if test -f "$RUNNER_TEMP/batchrecover-maven-provenance.jsonl"; then
            cp "$RUNNER_TEMP/batchrecover-maven-provenance.jsonl" target/maven-provenance.jsonl
          fi
      - name: Upload quality and staging artifacts
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: quality-and-local-staging
          path: |
            **/target/site/jacoco*/**
            **/target/pit-reports/**
            **/target/spotbugsXml.xml
            benchmarks/target/jmh.json
            target/bom.json
            target/osv-report.json
            target/build-dependency-inventory.json
            target/build-osv-report.json
            target/maven-provenance.jsonl
            target/image-audit/*.json
            target/batchrecover-local-preview.zip
            target/batchrecover-0.1.0-DO-NOT-UPLOAD.zip
            target/rehearsal-public-key.asc
          if-no-files-found: warn
      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: test-reports
          path: |
            **/target/surefire-reports/*.xml
            **/target/failsafe-reports/*.xml
          if-no-files-found: warn

  security-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout all reachable branches and tags
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Scan Git history with checksum-pinned Gitleaks
        run: bash scripts/audit_git_history.sh
      - name: Confirm owner public key on Central-supported keyserver
        if: success() || failure()
        run: bash scripts/verify_release_public_key.sh
